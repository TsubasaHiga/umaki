name: Build and Unit Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    # Allow manual execution

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      total-tests: ${{ steps.test-summary.outputs.total-tests }}
      failed-tests: ${{ steps.test-summary.outputs.failed-tests }}
      skipped-tests: ${{ steps.test-summary.outputs.skipped-tests }}
      test-files: ${{ steps.test-summary.outputs.test-files }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Uses the version from packageManager in package.json
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version

    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.pnpm-store
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Cache node_modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: node-modules-cache
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-node-modules-

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      run: pnpm install --frozen-lockfile

    - name: Build application
      run: pnpm run build

    - name: Smoke test packed package (import / require)
      run: node .github/scripts/smoke-test-package.mjs

    - name: Lint (Biome)
      run: pnpm run lint

    - name: Run unit tests with coverage
      run: |
        set -o pipefail
        pnpm run test:coverage 2>&1 | tee test-output.txt

    - name: Extract Test Results Summary
      id: test-summary
      if: always()
      run: |
        # Strip ANSI escape codes and pick the vitest summary lines
        CLEAN_OUTPUT=$(sed 's/\x1b\[[0-9;]*m//g' test-output.txt 2>/dev/null || true)
        TESTS_LINE=$(echo "$CLEAN_OUTPUT" | grep -E '^ *Tests ' | tail -1 || true)
        FILES_LINE=$(echo "$CLEAN_OUTPUT" | grep -E '^ *Test Files ' | tail -1 || true)

        # Prints the number before the given word (e.g. "3 failed" -> 3), or 0 if absent
        count() { echo "$1" | grep -oE "[0-9]+ $2" | grep -oE '[0-9]+' | head -1 || true; }
        TOTAL_TESTS=$(count "$TESTS_LINE" passed)
        FAILED_TESTS=$(count "$TESTS_LINE" failed)
        SKIPPED_TESTS=$(count "$TESTS_LINE" skipped)
        TEST_FILES=$(count "$FILES_LINE" passed)
        TOTAL_TESTS=${TOTAL_TESTS:-0}
        FAILED_TESTS=${FAILED_TESTS:-0}
        SKIPPED_TESTS=${SKIPPED_TESTS:-0}
        TEST_FILES=${TEST_FILES:-0}

        echo "total-tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
        echo "failed-tests=$FAILED_TESTS" >> $GITHUB_OUTPUT
        echo "skipped-tests=$SKIPPED_TESTS" >> $GITHUB_OUTPUT
        echo "test-files=$TEST_FILES" >> $GITHUB_OUTPUT

        # Create job summary
        echo "## 🧪 Unit Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| ✅ Tests Passed | $TOTAL_TESTS |" >> $GITHUB_STEP_SUMMARY
        echo "| ❌ Tests Failed | $FAILED_TESTS |" >> $GITHUB_STEP_SUMMARY
        echo "| ⏭️ Tests Skipped | $SKIPPED_TESTS |" >> $GITHUB_STEP_SUMMARY
        echo "| 📁 Test Files | $TEST_FILES |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Add coverage info if available
        if [ -d "coverage" ]; then
          echo "📊 **Coverage report generated** - see artifacts below" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test-output
        path: test-output.txt
        retention-days: 7

  # Runs separately so that install / build / test steps do not hold a write token
  comment:
    needs: test
    # GITHUB_TOKEN is read-only on pull requests from forks
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Comment PR with Test Results
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TOTAL_TESTS: ${{ needs.test.outputs.total-tests }}
        FAILED_TESTS: ${{ needs.test.outputs.failed-tests }}
        SKIPPED_TESTS: ${{ needs.test.outputs.skipped-tests }}
        TEST_FILES: ${{ needs.test.outputs.test-files }}
      with:
        script: |
          const totalTests = process.env.TOTAL_TESTS;
          const failedTests = process.env.FAILED_TESTS;
          const skippedTests = process.env.SKIPPED_TESTS;
          const testFiles = process.env.TEST_FILES;

          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          let status = '✅ All tests passed!';
          if (parseInt(failedTests) > 0) {
            status = `❌ ${failedTests} test(s) failed`;
          }

          const coverageInfo = '📊 Coverage report is in the artifacts | ';

          const body = `## 🧪 Unit Test Results

          ${status}

          | Status | Count |
          |--------|-------|
          | ✅ Tests Passed | ${totalTests} |
          | ❌ Tests Failed | ${failedTests} |
          | ⏭️ Tests Skipped | ${skippedTests} |
          | 📁 Test Files | ${testFiles} |

          ${coverageInfo}🔍 **[View Action Run](${runUrl})** | 📁 **[Download Artifacts](${runUrl}/artifacts)**

          <details>
          <summary>ℹ️ About this report</summary>

          - Unit tests run with Vitest (happy-dom, and jsdom for DOMPurify-based functions)
          - Tests cover all utilities under src/libs
          - Coverage report includes line, branch, and function coverage
          </details>`;

          // Try to find existing comment to update
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existingComment = comments.find(comment =>
            comment.user.login === 'github-actions[bot]' &&
            comment.body.includes('🧪 Unit Test Results')
          );

          if (existingComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }
