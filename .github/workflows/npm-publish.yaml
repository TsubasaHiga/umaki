# npm の Trusted Publisher にこのファイル名で登録済みのため、リネームすると publish が失敗する
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  # 依存のコードが OIDC トークンを取得できないよう、テストとビルドは id-token を持たないジョブで行う
  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable corepack 📦
        run: corepack enable

      - name: Install dependencies 🧹
        run: pnpm install --frozen-lockfile

      - name: Run tests 🧪
        run: pnpm run test:run

      - name: Build 🔨
        run: pnpm run build

      - name: Pack 📦
        run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 1

  # GITHUB_TOKEN で作成された Release は他の workflow を起動しないため、publish は同じ workflow 内で行う
  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC)
    steps:
      # setup-node が読む .node-version だけを取得する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
          sparse-checkout: .node-version
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # build ジョブで作った tarball を publish するだけにし、依存やリポジトリのコードは実行しない
      - name: Publish 🚀
        run: npm publish ./*.tgz --ignore-scripts --provenance --access public
