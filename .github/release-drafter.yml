# Release Drafter Configuration
# https://github.com/release-drafter/release-drafter
# Version is determined by the latest git tag (set in workflow)

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Categories for release notes
categories:
  - title: '✨ New Features'
    labels:
      - 'Type: Enhancement'
      - 'release:minor'
  - title: '🐛 Bug Fixes'
    labels:
      - 'Type: Bug'
  - title: '💥 Breaking Changes'
    labels:
      - 'release:major'
  - title: '📦 Dependencies'
    labels:
      - 'dependencies'
  - title: '🔧 Maintenance'
    labels:
      - 'Type: Maintenance'
      - 'Type: Improvement'
      - 'release:patch'
  - title: '📝 Documentation'
    labels:
      - 'Type: Documents'
  - title: '🧪 Tests'
    labels:
      - 'Type: Test'
  - title: '♻️ Refactoring'
    labels:
      - 'Type: Refactoring'
  - title: '⚡ Performance'
    labels:
      - 'Type: Performance'
  - title: '♿ Accessibility'
    labels:
      - 'Type: Accessibility'

# Exclude certain labels from release notes
exclude-labels:
  - 'skip-changelog'
  - 'no-changelog'

# Template for release notes
template: |
  ## What's Changed

  $CHANGES

  ---

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
